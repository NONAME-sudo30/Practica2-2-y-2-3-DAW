<VirtualHost *:80>
    ServerName taskflow.local
    ServerAdmin webmaster@taskflow.local
    DocumentRoot /var/www/taskflow/dist

    <Directory /var/www/taskflow/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/taskflow_error.log
    CustomLog ${APACHE_LOG_DIR}/taskflow_access.log combined
</VirtualHost>